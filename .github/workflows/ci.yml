name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      - name: Typecheck
        run: npm run typecheck

      # PR 단계에서도 실제 프로덕션 빌드가 성공하는지 확인한다 (Vite 빌드 오류 조기 발견)
      - name: Build
        run: npm run build
